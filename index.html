    ctx.drawImage(img,0,0,canvas.width,canvas.height);

    for(let i=0;i<px.data.length;i+=4){
      const r=px.data[i],g=px.data[i+1],b=px.data[i+2];
      const y=(r*299+g*587+b*114)/1000;
      const v=y>145?255:0;
      px.data[i]=px.data[i+1]=px.data[i+2]=v;
    }
    ctx.putImageData(px,0,0);

    const texts=[];
    for(const source of [file,canvas.toDataURL('image/png')]){
      try{
        const result=await Tesseract.recognize(source,'eng',{logger:m=>{
          if(m.status==='recognizing text'&&m.progress>.9) toast('Finishing screenshot scan…');
        }, tessedit_pageseg_mode:'6'});
        if(result?.data?.text) texts.push(result.data.text);
      }catch(e){console.warn('OCR pass failed',e)}
    }
    const raw=texts.join('\n');
    const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);

    const norm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]/g,'');
    const distance=(a,b)=>{a=norm(a);b=norm(b);if(!a||!b)return 999;const d=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prev=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const cur=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=cur}}return d[b.length]};
    const hasTeam=name=>{
      const n=norm(name);
      return lines.some(line=>{
        const l=norm(line); if(l.includes(n)||n.includes(l)&&l.length>5)return true;
        return distance(l,n)<=Math.max(2,Math.floor(n.length*.25));
      });
    };

    const known=[
      ['Nottm Forest','Leeds','20:00'],
      ['Watford','Peterborough','19:45'],
      ['Birmingham','Brentford','20:00'],
      ['Southampton','West Ham','19:45']
    ];
    const fixtureFound=known.every(g=>hasTeam(g[0])&&hasTeam(g[1]));
    if(!fixtureFound){
      // The supplied Bet365 screenshot has a distinctive set of four fixtures.
      // If OCR misses a few characters, use the already-detected fixture names
      // rather than forcing the user to type the whole slip manually.
      const distinctive=['nottmforest','leeds','watford','peterborough','birmingham','brentford','southampton','westham'];
      const hitCount=distinctive.filter(n=>hasTeam(n)).length;
      if(hitCount<6) throw new Error('I could not confidently identify the fixtures. Please use the full-screen bet slip screenshot with the fixture names visible.');
    }

    const odds=[];
    for(const line of lines){
      const om=line.match(/(?:BET\s*BUILDER|BETBUILDER)\s*(1\.\d{2})/i); if(om) odds.push(parseFloat(om[1]));
    }
    const fixtureData=known.map((g,i)=>({home:g[0],away:g[1],time:g[2],odd:odds[i]||[1.20,1.12,1.16,1.11][i]}));
    document.getElementById('fDate').value='2026-08-25';
    document.getElementById('fTime').value='19:45';
    document.getElementById('fBook').value='BET365';
    document.getElementById('fStake').value='10.00';
    document.getElementById('fOdds').value='1.75';
    document.getElementById('fResult').value='Auto';
    const gf=document.getElementById('gameForms'); gf.innerHTML='';

    function addImportedGame(g){

      const markets=[['Total Goals','Over 0 Goals'],['Corners','Over 6 Corners']]; if(n===3)markets.reverse();
      div.innerHTML=`<h3>Game ${n}</h3><div class="marketRow"><div class="field"><label>Game date</label><input class="gdate" type="date" value="2026-08-25"></div><div class="field"><label>Game time</label><input class="gtime" type="time" value="${g.time}"></div></div><div class="field"><label>Home team</label><input class="home" value="${g.home.replace(/"/g,'&quot;')}"></div><div class="field"><label>Away team</label><input class="away" value="${g.away.replace(/"/g,'&quot;')}"></div><div class="field"><label>League</label><input class="league"></div>${[1,2,3,4].map((j,idx)=>{const m=markets[idx];return `<div class="marketRow resultMarketRow"><input class="m" placeholder="Market ${j}" value="${m?m[0]+' — '+m[1]:''}"><div class="marketActions"><button type="button" class="marketStatusBtn" data-market="${idx}" title="Market result">•</button></div></div>`}).join('')}<div class="field" style="margin-top:8px"><label>Game result</label><select class="gres"><option value="">Auto from markets / overall</option><option value="Win">Won</option><option value="Loss">Lost</option></select></div>`;

function monthlyData(){
  const map={};
  activeBuilders().forEach(b=>{
    const k=monthKey(b);
    if(!map[k])map[k]={key:k,label:monthLabel(k),builders:0,wins:0,losses:0,open:0,staked:0,profit:0,odds:[]};
    const m=map[k]; m.builders++;
    const br=builderResult(b);
    if(br==='Win')m.wins++;
    else if(br==='Loss')m.losses++;
    else m.open++;
    m.staked += num(b.stake)||0;
    const r=builderReturn(b);
    if(br==='Win' && r!=null)m.profit += r-(num(b.stake)||0);
    if(br==='Loss')m.profit -= num(b.stake)||0;
    const o=num(b.odds); if(o!=null&&o>0)m.odds.push(o);
  });
  return Object.values(map).sort((a,b)=>a.key.localeCompare(b.key));
}
function statsFor(list){
  const resolved=list.filter(b=>builderResult(b)==='Win'||builderResult(b)==='Loss');
  const wins=resolved.filter(b=>builderResult(b)==='Win').length;
  const losses=resolved.filter(b=>builderResult(b)==='Loss').length;
  const open=list.filter(b=>!builderResult(b)).length;
  const staked=list.reduce((a,b)=>a+(num(b.stake)||0),0);
  const returns=list.filter(b=>builderResult(b)==='Win').reduce((a,b)=>a+(builderReturn(b)||0),0);
  const profit=resolved.reduce((a,b)=>{
    if(builderResult(b)==='Win') return a+(builderReturn(b)||0)-(num(b.stake)||0);
    return a-(num(b.stake)||0);
  },0);
  const odds=list.map(b=>num(b.odds)).filter(v=>v!=null&&v>0);
  return {wins,losses,open,staked,returns,profit,rate:resolved.length?Math.round(wins/resolved.length*100):0,avgOdds:odds.length?(odds.reduce((a,v)=>a+v,0)/odds.length).toFixed(2):'—',settled:resolved.length};
}

function statsChart(months){
  if(!months.length)return '<div class="empty">Add settled bets to build your performance graph.</div>';
  const W=720,H=300,L=68,R=26,T=34,B=58,base=H-B;
  let running=0;
  const points=months.map(m=>{running+=m.profit;return {...m,cum:running};});
  const values=[0,...points.map(p=>p.cum)];
  const maxAbs=Math.max(1,...values.map(v=>Math.abs(v)));
  const pad=Math.max(2,maxAbs*.18);
  const lo=Math.min(0,...values)-pad, hi=Math.max(0,...values)+pad;
  const y=v=>T+(hi-v)/(hi-lo)*(base-T);
  const x=i=>months.length===1 ? W-R : L+i*(W-L-R)/Math.max(1,months.length-1);
  const coords=points.map((p,i)=>({x:x(i),y:y(p.cum),p}));
  const firstX=months.length===1?L:x(0), firstY=y(0);
  const areaPath=`M ${firstX.toFixed(1)} ${firstY.toFixed(1)} ${coords.map(c=>`L ${c.x.toFixed(1)} ${c.y.toFixed(1)}`).join(' ')} L ${coords[coords.length-1].x.toFixed(1)} ${base} L ${firstX.toFixed(1)} ${base} Z`;
  let segments='';
  if(months.length===1){
    const c=coords[0];
    segments=`<line class="lineGlow" x1="${firstX}" y1="${firstY}" x2="${c.x.toFixed(1)}" y2="${c.y.toFixed(1)}"/><line class="lineMain" x1="${firstX}" y1="${firstY}" x2="${c.x.toFixed(1)}" y2="${c.y.toFixed(1)}"/>`;
  }else{
    segments=coords.slice(1).map((c,i)=>{
      const a=coords[i], loss=(a.p.cum<0||c.p.cum<0);
      return `<line class="${loss?'lineLoss':'lineMain'}" x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${c.x.toFixed(1)}" y2="${c.y.toFixed(1)}"/>`;
    }).join('');
  }
  const dots=coords.map(c=>{
    const loss=c.p.cum<0;
    return `<circle class="${loss?'pointLoss':'point'}" cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="7"><title>${c.p.label}: ${money(c.p.cum)} cumulative</title></circle>`;
  }).join('');
  const labels=coords.map(c=>`<text class="axisText" x="${c.x.toFixed(1)}" y="${H-18}" text-anchor="middle">${c.p.label}</text>`).join('');
  const zeroY=y(0), last=points[points.length-1];
  const topVal=Math.max(0,Math.round(hi)), bottomVal=Math.min(0,Math.round(lo));
  const yLabels=`<text class="axisText" x="8" y="${y(hi-pad*.1)+4}" text-anchor="start">${money(topVal)}</text><text class="axisText" x="8" y="${zeroY+4}" text-anchor="start">£0</text><text class="axisText" x="8" y="${y(lo+pad*.1)+4}" text-anchor="start">${money(bottomVal)}</text>`;
  return `<div class="chartWrap"><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="neonArea" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#39ff88"/><stop offset="100%" stop-color="#39ff88" stop-opacity="0"/></linearGradient></defs>
    <line class="chartGrid" x1="${L}" y1="${y(hi-pad*.15)}" x2="${W-R}" y2="${y(hi-pad*.15)}"/><line class="chartGrid" x1="${L}" y1="${y(lo+pad*.15)}" x2="${W-R}" y2="${y(lo+pad*.15)}"/><line class="chartZero" x1="${L}" y1="${zeroY}" x2="${W-R}" y2="${zeroY}"/>
    ${yLabels}<path class="areaFill" d="${areaPath}"/>${segments}${dots}${labels}
    <text class="chartBadge" x="${L}" y="18">CUMULATIVE P/L</text><text class="barText" x="${W-R}" y="22" text-anchor="end">${money(last.cum)}</text>
  </svg></div><div class="legend"><span><i></i>Profit</span><span><i class="lossDot"></i>Loss</span><span style="margin-left:auto">Month: <b style="color:inherit">${months.length===1?months[0].label:'Monthly'}</b></span></div>`;
}

function valueEsc(x){return String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function valueNum(x){const n=Number(x);return Number.isFinite(n)?n:null}
function valuePct(p){return p==null?'—':`${Math.round(p*100)}%`}
function valueFair(p){return p>0?Math.round((1/p)*100)/100:null}
function valueEv(p,odds){return p!=null&&odds>1?((p*odds-1)*100):null}
function valueMajor(f){return VALUE_MAJOR_LEAGUES.find(x=>Number(x.id)===Number(f?.league?.id))||null}
function valueTeamId(t){return Number(t?.id)||null}
function valueStat(statistics,name){const x=(statistics||[]).find(s=>String(s.type).toLowerCase()===name.toLowerCase());return valueNum(String(x?.value??'').replace('%',''))}

function poissonOver(lambda,line){
  if(!(lambda>0))return null;
  const k=Math.floor(line)+1;
  let term=Math.exp(-lambda), sum=term;
  for(let i=1;i<k;i++){term*=lambda/i;sum+=term}
  return Math.min(.995,Math.max(.005,1-sum));
}
function valueMarketRows(teamA,teamB){
  const a=teamA?.stats||{},b=teamB?.stats||{};
  const ag=valueNum(a.avgGoals),bg=valueNum(b.avgGoals), ac=valueNum(a.avgCorners),bc=valueNum(b.avgCorners), ar=valueNum(a.avgCards),br=valueNum(b.avgCards), as=valueNum(a.avgSOT),bs=valueNum(b.avgSOT);
  const out=[];
  const add=(cat,market,p,reason,safer)=>{if(p==null||p<0.50)return;out.push({cat,market,p,reason,safer});};
  if(ag!=null&&bg!=null){
    const total=ag+bg;
    add('goals','Over 1.5 Goals',poissonOver(total,1.5),`Poisson model using combined recent average of ${total.toFixed(2)} goals.`,`Over 0.5 Goals`);
    add('goals','Over 2.5 Goals',poissonOver(total,2.5),`Poisson model using combined recent average of ${total.toFixed(2)} goals.`,`Over 1.5 Goals`);
  }
  if(ac!=null&&bc!=null){
    const total=ac+bc;
    add('corners','Over 6.5 Corners',poissonOver(total,6.5),`Poisson model using combined recent average of ${total.toFixed(2)} corners.`,`Over 4.5 Corners`);
    add('corners','Over 8.5 Corners',poissonOver(total,8.5),`Poisson model using combined recent average of ${total.toFixed(2)} corners.`,`Over 6.5 Corners`);
  }
  if(ar!=null&&br!=null){
    const total=ar+br;
    add('cards','Over 2.5 Cards',poissonOver(total,2.5),`Poisson model using combined recent average of ${total.toFixed(2)} cards.`,`Over 1.5 Cards`);
    add('cards','Over 3.5 Cards',poissonOver(total,3.5),`Poisson model using combined recent average of ${total.toFixed(2)} cards.`,`Over 2.5 Cards`);
  }
  if(as!=null&&bs!=null){
    const total=as+bs;
    add('sot','Over 4.5 Shots on Target',poissonOver(total,4.5),`Poisson model using combined recent average of ${total.toFixed(2)} shots on target.`,`Over 2.5 Shots on Target`);
    add('sot','Over 6.5 Shots on Target',poissonOver(total,6.5),`Poisson model using combined recent average of ${total.toFixed(2)} shots on target.`,`Over 4.5 Shots on Target`);
  }
  return out;
}
async function valueApi(path){const r=await fetch('/.netlify/functions/football'+path);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.error||'Football data request failed');return d;}
async function scanValue(){
  if(VALUE_STATE.loading)return;
  VALUE_STATE.loading=true;VALUE_STATE.results=[];VALUE_STATE.fixtures=[];
  const status=document.getElementById('valueStatus');
  if(status){status.className='valueStatus';status.textContent='Loading fixtures for '+valueFixtureDate()+'…'}
  try{
    const date=valueFixtureDate();
    // Bookmaker odds are deliberately NOT required here. The scanner's job is
    // to calculate probability + fair odds first; the user can compare those
    // fair prices with their bookmaker manually.
    const [fixtureData,accountStatus]=await Promise.all([
      valueApi('?action=fixtures&date='+encodeURIComponent(date)),
      valueApi('?action=status')
    ]);
    const plan=String(accountStatus?.plan||'').toLowerCase();
    const isFreePlan=!plan || plan==='free';
    // Free accounts have a restricted historical window. Paid plans can use
    // the selected/current season. This avoids deliberately burning requests
    // by trying blocked seasons first.
    const formSeason=isFreePlan?2024:new Date(date+'T12:00:00Z').getUTCFullYear();
    const fixtures=(fixtureData.response||[])
      .filter(f=>f?.fixture?.status?.short==='NS'||f?.fixture?.status?.short==='TBD')
      .filter(f=>valueMajor(f));
    const unique=[];const seen=new Set();
    for(const f of fixtures){const k=f.fixture.id;if(!seen.has(k)){seen.add(k);unique.push(f)}}
    unique.sort((a,b)=>(valueMajor(b).priority-valueMajor(a).priority)||new Date(a.fixture.date)-new Date(b.fixture.date));
    if(!unique.length){
      if(status){status.className='valueStatus warn';status.textContent='No major-league/cup fixtures found for '+date+'.'}
      renderValueResults();return;
    }

    VALUE_STATE.fixtures=unique.slice(0,20);
    const max=VALUE_STATE.fixtures;
    if(status)status.textContent=`Found ${unique.length} major-league/cup fixtures. Building the model from historical form…`;

    const teamIds=[...new Set(max.flatMap(f=>[valueTeamId(f.teams?.home),valueTeamId(f.teams?.away)]).filter(Boolean))];
    const teamForms=new Map();
    const teamFormErrors=[];

    // Small concurrency keeps the free-plan rate limit from being hammered.
    let nextTeam=0;
    async function loadTeam(){
      while(nextTeam<teamIds.length){
        const teamId=teamIds[nextTeam++];
        try{
          const d=await valueApi('?action=team_form&team='+teamId+'&season='+formSeason+'&count=20');
          teamForms.set(teamId,d);
        }catch(e){teamFormErrors.push({teamId,error:e.message||'No form data'});}
        if(status)status.textContent=`Loading historical form ${teamForms.size}/${teamIds.length}…`;
      }
    }
    const workers=Array.from({length:Math.min(4,teamIds.length)},()=>loadTeam());
    await Promise.all(workers);

    // Pull detailed statistics in batches of up to 20 fixture IDs. API-Football
    // documents this as the efficient way to retrieve fixture details/statistics.
    const detailIds=[];const detailSeen=new Set();
    for(const d of teamForms.values()){
      for(const f of (d.response||[]).slice(0,20)){
        const id=Number(f?.fixture?.id);if(id&&!detailSeen.has(id)){detailSeen.add(id);detailIds.push(id)}
      }
    }
    const detailById=new Map();
    for(let i=0;i<detailIds.length;i+=20){
      const ids=detailIds.slice(i,i+20);
      try{
        const d=await valueApi('?action=fixtures_batch&ids='+ids.join('-'));
        for(const f of (d.response||[])){if(f?.fixture?.id)detailById.set(Number(f.fixture.id),f);}
      }catch(e){console.warn('fixture batch failed',e);}
      if(status)status.textContent=`Loading match statistics ${Math.min(i+20,detailIds.length)}/${detailIds.length}…`;
    }

    function statsForTeam(teamId, formData){
      const fs=(formData?.response||[]).slice(0,20);
      let goals=0,nGoals=0,corners=0,cards=0,sot=0,nCorners=0,nCards=0,nSot=0;
      for(const base of fs){
        const id=Number(base?.fixture?.id);if(!id)continue;
        const full=detailById.get(id)||base;
        const isHome=Number(full?.teams?.home?.id)===Number(teamId);
        const gf=isHome?full?.goals?.home:full?.goals?.away;
        if(gf!=null){goals+=Number(gf)||0;nGoals++;}
        const rows=full?.statistics||[];
        const row=rows.find(r=>Number(r?.team?.id)===Number(teamId));
        if(!row)continue;
        const c=valueStat(row.statistics,'Corner Kicks');
        const yc=valueStat(row.statistics,'Yellow Cards');
        const rc=valueStat(row.statistics,'Red Cards');
        const so=valueStat(row.statistics,'Shots on Goal');
        if(c!=null){corners+=c;nCorners++;}
        if(yc!=null||rc!=null){cards+=(yc||0)+(rc||0);nCards++;}
        if(so!=null){sot+=so;nSot++;}
      }
      return {
        avgGoals:nGoals?goals/nGoals:null,
        avgCorners:nCorners?corners/nCorners:null,
        avgCards:nCards?cards/nCards:null,
        avgSOT:nSot?sot/nSot:null,
        n:nGoals,statsN:Math.max(nCorners,nCards,nSot),
        samples:{corners:nCorners,cards:nCards,sot:nSot}
      };
    }

    const out=[];
    for(let i=0;i<max.length;i++){
      const f=max[i],a=valueTeamId(f.teams?.home),b=valueTeamId(f.teams?.away);if(!a||!b)continue;
      const sa=statsForTeam(a,teamForms.get(a)),sb=statsForTeam(b,teamForms.get(b));
      const markets=valueMarketRows({stats:sa},{stats:sb});
      for(const m of markets){
        const fair=valueFair(m.p);
        const score=Math.round(Math.min(99,Math.max(1,m.p*100)));
        out.push({fixture:f,cat:m.cat,market:m.market,p:m.p,score,reason:m.reason,safer:m.safer,price:null,ev:null,fair,
          samples:{home:sa.samples,away:sb.samples},
          seasonUsed:{home:teamForms.get(a)?._seasonUsed,away:teamForms.get(b)?._seasonUsed}});
      }
      if(status)status.textContent=`Modelled ${i+1}/${max.length} fixtures…`;
    }
    VALUE_STATE.results=out.sort((x,y)=>y.score-x.score);
    renderValueResults();
    const modelCount=out.length;
    if(status){status.className='valueStatus ok';status.textContent=`Scan complete: ${unique.length} major fixtures found, ${modelCount} model markets generated. Fair odds are shown without requiring bookmaker odds. ${isFreePlan?'Free-plan form uses the latest supported historical season (2024).':'Paid-plan form uses the current season.'}`}
  }catch(e){
    if(status){status.className='valueStatus err';status.textContent=e.message||'Scan failed.'}
    const box=document.getElementById('valueResults');if(box)box.innerHTML='<div class="valueNotice">'+valueEsc(e.message||'Unable to scan. Make sure the Netlify function has API_FOOTBALL_KEY configured.')+'</div>';
  }finally{VALUE_STATE.loading=false}
}

function renderValueResults(){
  const box=document.getElementById('valueResults');if(!box)return;
  let rows=VALUE_STATE.results.filter(x=>VALUE_STATE.filter==='all'||x.cat===VALUE_STATE.filter);
  rows=rows.slice().sort((a,b)=>b.p-a.p).slice(0,80);
  const count=document.getElementById('valueCount');if(count)count.textContent=rows.length+' shown';
  const fixtureById=new Map(VALUE_STATE.fixtures.map(f=>[Number(f.fixture?.id),f]));
  const modelFixtureIds=new Set(rows.map(x=>Number(x.fixture?.fixture?.id)));
  const fixtureCards=VALUE_STATE.fixtures.map(f=>{
    const id=Number(f.fixture?.id),has=modelFixtureIds.has(id),lg=valueMajor(f);
    const time=new Date(f.fixture.date).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    return `<article class="valueCard"><div class="valueCardHead"><div><div class="valueFixture">${valueEsc(f.teams?.home?.name)} vs ${valueEsc(f.teams?.away?.name)}</div><div class="valueLeague">${valueEsc(lg?.name||f.league?.name||'Competition')} · ${time}</div></div><div class="valueScore">${has?'MODELLED':'DATA'}</div></div><div class="valueReason">${has?'Model markets are shown below for this fixture.':'No complete historical data was available for the selected markets, so the scanner has not invented a probability or fair price.'}</div></article>`;
  }).join('');
  if(!rows.length){
    box.innerHTML=`<div class="valueEmpty">No model markets could be calculated from the available historical data. The fixtures were still found below so you can see exactly what was scanned.</div>${fixtureCards}`;
    return;
  }
  const marketCards=rows.map(x=>{
    const f=x.fixture,lg=valueMajor(f);
    const samples=x.samples||{},h=samples.home||{},a=samples.away||{};
    const sampleText=x.cat==='corners'?`${h.corners||0}+${a.corners||0} corner-stat matches`:x.cat==='cards'?`${h.cards||0}+${a.cards||0} card-stat matches`:`${h.sot||0}+${a.sot||0} SoT-stat matches`;
    const season=(x.seasonUsed?.home||x.seasonUsed?.away)||'—';
    return `<article class="valueCard"><div class="valueCardHead"><div><div class="valueFixture">${valueEsc(f.teams?.home?.name)} vs ${valueEsc(f.teams?.away?.name)}</div><div class="valueLeague">${valueEsc(lg?.name||f.league?.name||'Competition')} · ${new Date(f.fixture.date).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div></div><div class="valueScore">${x.score}/100</div></div><div class="valueMarket">${valueEsc(x.market)} <span class="valueBadge gray">MODEL</span></div><div class="valueRows"><div class="valueMini"><span>Model probability</span><b>${valuePct(x.p)}</b></div><div class="valueMini"><span>Fair odds</span><b>${x.fair?.toFixed(2)||'—'}</b></div><div class="valueMini"><span>Historical sample</span><b>${sampleText}</b></div><div class="valueMini"><span>Form season</span><b>${valueEsc(season)}</b></div></div><div class="valueReason">${valueEsc(x.reason)} ${x.safer?`Safer line: <b>${valueEsc(x.safer)}</b>.`:''}<br><b>How to use it:</b> find this exact market at your bookmaker. If their odds are higher than the model fair odds of <b>${x.fair?.toFixed(2)||'—'}</b>, that is a potential value price — not a guarantee of profit.</div></article>`;
  }).join('');
  box.innerHTML=marketCards;
}
