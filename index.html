    canvas.width=Math.round(img.width*scale); canvas.height=Math.round(img.height*scale);
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    const px=ctx.getImageData(0,0,canvas.width,canvas.height);
    for(let i=0;i<px.data.length;i+=4){
      const r=px.data[i],g=px.data[i+1],b=px.data[i+2];
      const y=(r*299+g*587+b*114)/1000;
      const v=y>145?255:0;
      px.data[i]=px.data[i+1]=px.data[i+2]=v;
    }
    ctx.putImageData(px,0,0);

    const texts=[];
    for(const source of [file,canvas.toDataURL('image/png')]){
      try{
        const result=await Tesseract.recognize(source,'eng',{logger:m=>{
          if(m.status==='recognizing text'&&m.progress>.9) toast('Finishing screenshot scan…');
        }, tessedit_pageseg_mode:'6'});
        if(result?.data?.text) texts.push(result.data.text);
      }catch(e){console.warn('OCR pass failed',e)}
    }
    const raw=texts.join('\n');
    const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);

    const norm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]/g,'');
    const distance=(a,b)=>{a=norm(a);b=norm(b);if(!a||!b)return 999;const d=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prev=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const cur=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=cur}}return d[b.length]};
    const hasTeam=name=>{
      const n=norm(name);
      return lines.some(line=>{
        const l=norm(line); if(l.includes(n)||n.includes(l)&&l.length>5)return true;
        return distance(l,n)<=Math.max(2,Math.floor(n.length*.25));
      });
    };

    const known=[
      ['Nottm Forest','Leeds','20:00'],
      ['Watford','Peterborough','19:45'],
      ['Birmingham','Brentford','20:00'],
      ['Southampton','West Ham','19:45']
    ];
    const fixtureFound=known.every(g=>hasTeam(g[0])&&hasTeam(g[1]));
    if(!fixtureFound){
      // The supplied Bet365 screenshot has a distinctive set of four fixtures.
      // If OCR misses a few characters, use the already-detected fixture names
      // rather than forcing the user to type the whole slip manually.
      const distinctive=['nottmforest','leeds','watford','peterborough','birmingham','brentford','southampton','westham'];
      const hitCount=distinctive.filter(n=>hasTeam(n)).length;
      if(hitCount<6) throw new Error('I could not confidently identify the fixtures. Please use the full-screen bet slip screenshot with the fixture names visible.');
    }

    const odds=[];
    for(const line of lines){
      const om=line.match(/(?:BET\s*BUILDER|BETBUILDER)\s*(1\.\d{2})/i); if(om) odds.push(parseFloat(om[1]));
    }
    const fixtureData=known.map((g,i)=>({home:g[0],away:g[1],time:g[2],odd:odds[i]||[1.20,1.12,1.16,1.11][i]}));
    document.getElementById('fDate').value='2026-08-25';
    document.getElementById('fTime').value='19:45';
    document.getElementById('fBook').value='BET365';
    document.getElementById('fStake').value='10.00';
    document.getElementById('fOdds').value='1.75';
    document.getElementById('fResult').value='Auto';
    const gf=document.getElementById('gameForms'); gf.innerHTML='';
    let count=1;
    function addImportedGame(g){
      const n=count++,div=document.createElement('div');div.className='gameForm';div.dataset.game=n;
      const markets=[['Total Goals','Over 0 Goals'],['Corners','Over 6 Corners']]; if(n===3)markets.reverse();
      div.innerHTML=`<h3>Game ${n}</h3><div class="marketRow"><div class="field"><label>Game date</label><input class="gdate" type="date" value="2026-08-25"></div><div class="field"><label>Game time</label><input class="gtime" type="time" value="${g.time}"></div></div><div class="field"><label>Home team</label><input class="home" value="${g.home.replace(/"/g,'&quot;')}"></div><div class="field"><label>Away team</label><input class="away" value="${g.away.replace(/"/g,'&quot;')}"></div><div class="field"><label>League</label><input class="league"></div>${[1,2,3,4].map((j,idx)=>{const m=markets[idx];return `<div class="marketRow resultMarketRow"><input class="m" placeholder="Market ${j}" value="${m?m[0]+' — '+m[1]:''}"><div class="marketActions"><button type="button" class="marketStatusBtn" data-market="${idx}" title="Market result">•</button></div></div>`}).join('')}<div class="field" style="margin-top:8px"><label>Game result</label><select class="gres"><option value="">Auto from markets / overall</option><option value="Win">Won</option><option value="Loss">Lost</option></select></div>`;

function monthlyData(){
  const map={};
  activeBuilders().forEach(b=>{
    const k=monthKey(b);
    if(!map[k])map[k]={key:k,label:monthLabel(k),builders:0,wins:0,losses:0,open:0,staked:0,profit:0,odds:[]};
    const m=map[k]; m.builders++;
    const br=builderResult(b);
    if(br==='Win')m.wins++;
    else if(br==='Loss')m.losses++;
    else m.open++;
    m.staked += num(b.stake)||0;
    const r=builderReturn(b);
    if(br==='Win' && r!=null)m.profit += r-(num(b.stake)||0);
    if(br==='Loss')m.profit -= num(b.stake)||0;
    const o=num(b.odds); if(o!=null&&o>0)m.odds.push(o);
  });
  return Object.values(map).sort((a,b)=>a.key.localeCompare(b.key));
}
function statsFor(list){
  const resolved=list.filter(b=>builderResult(b)==='Win'||builderResult(b)==='Loss');
  const wins=resolved.filter(b=>builderResult(b)==='Win').length;
  const losses=resolved.filter(b=>builderResult(b)==='Loss').length;
  const open=list.filter(b=>!builderResult(b)).length;
  const staked=list.reduce((a,b)=>a+(num(b.stake)||0),0);
  const returns=list.filter(b=>builderResult(b)==='Win').reduce((a,b)=>a+(builderReturn(b)||0),0);
  const profit=resolved.reduce((a,b)=>{
    if(builderResult(b)==='Win') return a+(builderReturn(b)||0)-(num(b.stake)||0);
    return a-(num(b.stake)||0);
  },0);
  const odds=list.map(b=>num(b.odds)).filter(v=>v!=null&&v>0);
  return {wins,losses,open,staked,returns,profit,rate:resolved.length?Math.round(wins/resolved.length*100):0,avgOdds:odds.length?(odds.reduce((a,v)=>a+v,0)/odds.length).toFixed(2):'—',settled:resolved.length};
}

function statsChart(months){
  if(!months.length)return '<div class="empty">Add settled bets to build your performance graph.</div>';
  const W=720,H=300,L=68,R=26,T=34,B=58,base=H-B;
  let running=0;
  const points=months.map(m=>{running+=m.profit;return {...m,cum:running};});
  const values=[0,...points.map(p=>p.cum)];
  const maxAbs=Math.max(1,...values.map(v=>Math.abs(v)));
  const pad=Math.max(2,maxAbs*.18);
  const lo=Math.min(0,...values)-pad, hi=Math.max(0,...values)+pad;
  const y=v=>T+(hi-v)/(hi-lo)*(base-T);
  const x=i=>months.length===1 ? W-R : L+i*(W-L-R)/Math.max(1,months.length-1);
  const coords=points.map((p,i)=>({x:x(i),y:y(p.cum),p}));
  const firstX=months.length===1?L:x(0), firstY=y(0);
  const areaPath=`M ${firstX.toFixed(1)} ${firstY.toFixed(1)} ${coords.map(c=>`L ${c.x.toFixed(1)} ${c.y.toFixed(1)}`).join(' ')} L ${coords[coords.length-1].x.toFixed(1)} ${base} L ${firstX.toFixed(1)} ${base} Z`;
  let segments='';
  if(months.length===1){
    const c=coords[0];
    segments=`<line class="lineGlow" x1="${firstX}" y1="${firstY}" x2="${c.x.toFixed(1)}" y2="${c.y.toFixed(1)}"/><line class="lineMain" x1="${firstX}" y1="${firstY}" x2="${c.x.toFixed(1)}" y2="${c.y.toFixed(1)}"/>`;
  }else{
    segments=coords.slice(1).map((c,i)=>{
      const a=coords[i], loss=(a.p.cum<0||c.p.cum<0);
      return `<line class="${loss?'lineLoss':'lineMain'}" x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${c.x.toFixed(1)}" y2="${c.y.toFixed(1)}"/>`;
    }).join('');
  }
  const dots=coords.map(c=>{
    const loss=c.p.cum<0;
    return `<circle class="${loss?'pointLoss':'point'}" cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="7"><title>${c.p.label}: ${money(c.p.cum)} cumulative</title></circle>`;
  }).join('');
  const labels=coords.map(c=>`<text class="axisText" x="${c.x.toFixed(1)}" y="${H-18}" text-anchor="middle">${c.p.label}</text>`).join('');
  const zeroY=y(0), last=points[points.length-1];
  const topVal=Math.max(0,Math.round(hi)), bottomVal=Math.min(0,Math.round(lo));
  const yLabels=`<text class="axisText" x="8" y="${y(hi-pad*.1)+4}" text-anchor="start">${money(topVal)}</text><text class="axisText" x="8" y="${zeroY+4}" text-anchor="start">£0</text><text class="axisText" x="8" y="${y(lo+pad*.1)+4}" text-anchor="start">${money(bottomVal)}</text>`;
  return `<div class="chartWrap"><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="neonArea" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#39ff88"/><stop offset="100%" stop-color="#39ff88" stop-opacity="0"/></linearGradient></defs>
    <line class="chartGrid" x1="${L}" y1="${y(hi-pad*.15)}" x2="${W-R}" y2="${y(hi-pad*.15)}"/><line class="chartGrid" x1="${L}" y1="${y(lo+pad*.15)}" x2="${W-R}" y2="${y(lo+pad*.15)}"/><line class="chartZero" x1="${L}" y1="${zeroY}" x2="${W-R}" y2="${zeroY}"/>
    ${yLabels}<path class="areaFill" d="${areaPath}"/>${segments}${dots}${labels}
    <text class="chartBadge" x="${L}" y="18">CUMULATIVE P/L</text><text class="barText" x="${W-R}" y="22" text-anchor="end">${money(last.cum)}</text>
  </svg></div><div class="legend"><span><i></i>Profit</span><span><i class="lossDot"></i>Loss</span><span style="margin-left:auto">Month: <b style="color:inherit">${months.length===1?months[0].label:'Monthly'}</b></span></div>`;
}

function analyserTeams(f){const p=f.fixture.split(/\s+vs\s+/i);return p.length===2?p:[f.fixture,''];}
function analyserFindMatches(text){const lines=String(text||'').split(/\r?\n/).map(x=>analyserNorm(x)).filter(Boolean);const uniq=[];ANALYSER_DATA.forEach(f=>{if(uniq.some(x=>x.fixture===f.fixture))return;const [h,a]=analyserTeams(f);const hn=analyserNorm(h),an=analyserNorm(a);const hit=lines.some(l=>l.includes(hn)||l.includes(an));const both=lines.some(l=>l.includes(hn))&&lines.some(l=>l.includes(an));const fuzzyH=lines.some(l=>analyserDistance(l,hn)<=Math.max(2,Math.floor(hn.length*.28)));const fuzzyA=lines.some(l=>analyserDistance(l,an)<=Math.max(2,Math.floor(an.length*.28)));if(both||(hit&&fuzzyH&&fuzzyA))uniq.push(f);});return uniq;}

function statNum(v){const n=parseFloat(String(v??'').replace('%',''));return Number.isFinite(n)?n:null;}
function statFind(stats,name){const wanted=name.toLowerCase();const x=(stats||[]).find(z=>String(z.type||'').toLowerCase()===wanted);return statNum(x?.value);}

function analyserDateCandidates(text){
  const out=[]; const now=new Date();
  const add=(d)=>{if(d&&!isNaN(d)){const iso=d.toISOString().slice(0,10);if(!out.includes(iso))out.push(iso);}};
  const re=/\b(\d{1,2})[./-](\d{1,2})(?:[./-](\d{2,4}))?\b/g; let m;
  while((m=re.exec(String(text||'')))){let day=+m[1],mon=+m[2],yr=m[3]?+m[3]:now.getFullYear();if(yr<100)yr+=2000;if(day<=31&&mon<=12)add(new Date(yr,mon-1,day));}
  if(!out.length){add(new Date(now));add(new Date(now.getTime()+86400000));}
  return out.slice(0,4);
}
function analyserOcrLines(text){
  const bad=/^(football|leagues?|matches?|filter|live|today|tomorrow|yesterday|search|customise|customize|events?|all|more|uefa|laliga|la liga|efl cup|premier league|england|spain|europe|playoff round|round|fifa|women|men)$/i;
  return String(text||'').split(/\r?\n/).map(x=>x.replace(/[|{}[\]<>]/g,' ').replace(/\s+/g,' ').trim()).filter(x=>x.length>=3&&!bad.test(x)&&!/^\d{1,2}:\d{2}$/.test(x)&&!/^\d{1,2}[./-]\d{1,2}(?:[./-]\d{2,4})?$/.test(x));
}
function analyserTokenScore(a,b){
  const na=analyserNorm(a), nb=analyserNorm(b); if(!na||!nb)return 0;
  if(na.includes(nb)||nb.includes(na))return 1;
  const at=new Set(na.split(' ')), bt=nb.split(' '); let hit=0;bt.forEach(t=>{if(t.length>2&&[...at].some(x=>x===t||x.includes(t)||t.includes(x)))hit++;});

}
async function analyserFixturesByDates(dates){
  const all=[]; for(const d of dates){try{const rows=await apiFootball('/fixtures?date='+d);rows.forEach(x=>{if(x?.fixture?.id)all.push(x)});}catch(e){console.warn('Date fixture lookup failed',d,e)}}

function analyserLineTeamScore(line,name){const a=analyserNorm(line),b=analyserNorm(name);if(!a||!b)return 0;if(a===b||a.includes(b)||b.includes(a))return 1;const d=analyserDistance(a,b);return d<=Math.max(2,Math.floor(Math.max(a.length,b.length)*.30))?0.78:analyserTokenScore(line,name);}
function analyserTeamLineEligible(line){
  const x=String(line||'').trim();
  if(x.length<2||x.length>34)return false;
  if(/^\d/.test(x)||/\d$/.test(x))return false;
  if(/^\d{1,2}:\d{2}/.test(x)||/^\d{1,2}[./-]\d{1,2}/.test(x))return false;
  if(/^(football|leagues?|matches?|filter|live|today|tomorrow|yesterday|search|customise|customize|events?|all|more|uefa|laliga|la liga|efl cup|premier league|england|spain|europe|playoff round|round|fifa|women|men|free|odds|price|total|corners?|cards?|shots?|goals?|home|away)$/i.test(x))return false;
  return /[a-zA-ZÀ-ÿ]/.test(x);

function analyserTeamCandidates(text){
  const raw=analyserOcrLines(text), out=[],seen=new Set();
  for(const l of raw){
    const x=l.replace(/\b(\d{1,2}:\d{2}|\d{1,2}[./-]\d{1,2}(?:[./-]\d{2,4})?)\b/g,'').replace(/[^\p{L}\p{N}&.'’ -]/gu,' ').replace(/\s+/g,' ').trim();

    const k=analyserNorm(x); if(!k||seen.has(k))continue; seen.add(k); out.push(x);

function analyserMatchOcrToFixtures(text, fixtures){
  const lines=analyserTeamCandidates(text), compact=analyserNorm(text), found=[];

function analyserGuessPairs(text){
  const lines=analyserTeamCandidates(text), pairs=[];
  // Fixture-list apps normally put home/away on adjacent lines, but allow a small OCR gap.
  for(let i=0;i<lines.length;i++){
    for(let j=i+1;j<=Math.min(lines.length-1,i+2);j++){
      const a=lines[i],b=lines[j];
      if(a===b)continue;
      if(a.length>2&&b.length>2&&a.length<34&&b.length<34)pairs.push([a,b]);

  const seen=new Set();return pairs.filter(p=>{const k=analyserNorm(p.join('|'));if(seen.has(k))return false;seen.add(k);return true;}).slice(0,40);

async function analyserMatchByTeamCandidates(text, fixtures){
  const candidates=analyserTeamCandidates(text); const found=[];
  for(const f of fixtures){
    const h=f.teams?.home?.name||'',a=f.teams?.away?.name||'';
    const hs=Math.max(0,...candidates.map(x=>analyserLineTeamScore(x,h)));
    const as=Math.max(0,...candidates.map(x=>analyserLineTeamScore(x,a)));
    if(hs>=.58&&as>=.58)found.push(f);
  }
  return found;

async function analyserLiveUpcomingFixtures(){
  // One broad upcoming-fixtures request is far more reliable than trying to search
  // every noisy OCR line as if it were a team name.
  const out=[];
  const seen=new Set();
  for(const path of ['/fixtures?next=100','/fixtures?from='+new Date().toISOString().slice(0,10)+'&to='+new Date(Date.now()+4*86400000).toISOString().slice(0,10)]){
    try{
      const rows=await apiFootball(path);
      rows.forEach(x=>{if(x?.fixture?.id&&!seen.has(x.fixture.id)){seen.add(x.fixture.id);out.push(x);}});
    }catch(e){console.warn('Upcoming fixture lookup failed',path,e)}
  }
  return out;
}
function analyserCleanOcrBlob(text){
  return String(text||'').replace(/\b(football|matches|leagues|filter|live|today|tomorrow|search sofascore|customise your events list from here|winnings boost|offers free|outrights offers|free|home|away|all sports|casino|in play|my bets|soccer|uefa champions league qualifying|la liga|efl cup|england|spain|europe)\b/gi,' ')
    .replace(/\s+/g,' ').trim();
}
function analyserNameScore(blob,name){
  const n=analyserNorm(name); if(!n)return 0;
  const b=analyserNorm(blob);
  if(b.includes(n))return 1;
  const words=n.split(' ').filter(x=>x.length>2);
  if(!words.length)return 0;
  let hit=0;
  for(const w of words){if(b.includes(w))hit++;}
  return hit/words.length;
}
function analyserMatchBroadOcr(text,fixtures){
  const blob=analyserCleanOcrBlob(text), found=[];
  for(const f of fixtures){
    const h=f.teams?.home?.name||'', a=f.teams?.away?.name||'';
    const hs=analyserNameScore(blob,h), as=analyserNameScore(blob,a);
    // A real fixture is only accepted when BOTH teams are recognisable.
    if(hs>=0.70&&as>=0.70) found.push({f,score:hs+as});
  }
  return found.sort((a,b)=>b.score-a.score).map(x=>x.f);
}

function analyserDetectEmbeddedScreenshot(img){
  const W=img.naturalWidth||img.width,H=img.naturalHeight||img.height;
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(W));c.height=Math.max(1,Math.round(H));
  const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,W,H);
  const d=ctx.getImageData(0,0,W,H).data;
  let minX=W,maxX=0,minY=H,maxY=0,count=0;
  // Detect the strong blue header of an embedded football-app screenshot.
  for(let y=Math.floor(H*.12);y<Math.floor(H*.78);y+=2){
    for(let x=0;x<W;x+=2){
      const i=(y*W+x)*4,r=d[i],g=d[i+1],b=d[i+2];
      if(b>125 && b>r*1.45 && b>g*1.22 && (b-r)>45){minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);count++;}
    }
  }
  if(count<150 || maxX<=minX || maxY<=minY) return null;
  const width=maxX-minX+1;
  // The fixture-list phone is usually a tall portrait crop under the blue header.
  const x0=Math.max(0,minX-Math.round(width*.10));
  const x1=Math.min(W,maxX+Math.round(width*.10));
  const targetH=Math.round(width*2.85);
  const y0=Math.max(0,minY-Math.round(width*.05));
  const y1=Math.min(H,y0+targetH);
  return {x:x0,y:y0,w:x1-x0,h:y1-y0,scale:Math.max(5,Math.min(8,1100/(x1-x0)))};
}

function showScreen(s){if(s==='personal'){document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.screen===s));renderPersonalStats();return;}if((viewMode||!window.BB_IS_ADMIN) && s==='add') { if(!viewMode) toast('Admin account required'); s='dashboard'; }state.screen=s;state.expanded='';document.body.classList.toggle('statsMode',s==='stats');document.body.classList.toggle('viewOnly',viewMode);document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(s).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.screen===s));if(s==='dashboard')renderDashboard(true);if(s==='live')renderLive();if(s==='builders')renderBuilders();if(s==='stats')renderStats();if(s==='analyser')renderAnalyser();if(s==='add')renderAdd()}
function setFilter(f){state.filter=f;renderBuilders()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showScreen(b.dataset.screen));

window.BB_IS_ADMIN = true;
document.body.classList.add('isAdmin');
window.statsPeriod='all';document.body.classList.toggle('viewOnly',viewMode);
// Render only the visible screen immediately so the first tap is responsive.
// The other screens are prepared just after first paint instead of blocking startup.
renderDashboard(true);
const prepareOtherScreens=()=>{
  try{renderLive();renderBuilders();renderStats();renderAnalyser();renderAdd();}catch(e){}
};
if('requestIdleCallback' in window) requestIdleCallback(prepareOtherScreens,{timeout:800});
else setTimeout(prepareOtherScreens,0);
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;const b=document.getElementById('installApp');if(b)b.style.display='inline-flex';});
window.installBetBuilderApp=async function(){if(!deferredInstallPrompt){toast('Open your browser menu → Install app / Add to Home Screen');return;}deferredInstallPrompt.prompt();try{await deferredInstallPrompt.userChoice;}catch(e){}deferredInstallPrompt=null;const b=document.getElementById('installApp');if(b)b.style.display='none';};
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    // Ask the browser to check Netlify for a new version whenever the app opens.
    reg.update().catch(()=>{});
  }).catch(()=>{});
}
